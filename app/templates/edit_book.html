<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Редактировать книгу</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
</head>
<body>

<div class="container mt-5">
  <h2>Редактировать книгу</h2>
  <form action="/books/{{ book.id }}/update" method="post">
    <div class="mb-3">
      <label class="form-label">Название *</label>
      <input type="text" name="title" class="form-control" value="{{ book.title }}" required />
    </div>
    <div class="mb-3">
      <label class="form-label">Автор *</label>
      <input type="text" name="author" class="form-control" value="{{ book.author }}" required />
    </div>
    <div class="mb-3">
      <label class="form-label">Жанр</label>
      <input type="text" name="genre" class="form-control" value="{{ book.genre or '' }}" />
    </div>
    <div class="mb-3">
      <label class="form-label">Статус</label>
      <select name="status" class="form-select">
        <option value="в планах" {% if book.status == "в планах" %}selected{% endif %}>в планах</option>
        <option value="в процессе" {% if book.status == "в процессе" %}selected{% endif %}>в процессе</option>
        <option value="прочитана" {% if book.status == "прочитана" %}selected{% endif %}>прочитана</option>
      </select>
    </div>
    <button type="submit" class="btn btn-primary">Сохранить</button>
    <a href="/" class="btn btn-secondary">Отмена</a>
  </form>
</div>

</body>
</html>
